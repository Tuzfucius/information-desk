name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * 0"

permissions:
  contents: read

jobs:
  quality:
    name: Static checks and lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m compileall -q src tests

  tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: >-
          uv run --locked pytest -p pytest_asyncio.plugin -p pytest_cov.plugin
          -m "not live" --cov=info_desk --cov-report=term-missing
          --cov-report=xml --cov-fail-under=80 -q

  wheel:
    name: Build and install wheel (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv build
      - run: uv venv --python 3.11 .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - name: Verify packaged SQL and installed CLI
        shell: bash
        run: |
          .wheel-venv/bin/python -c 'from importlib.resources import files; root = files("info_desk.storage").joinpath("sql"); assert all(root.joinpath(name).is_file() for name in ("001_initial.sql", "002_reliability.sql", "003_m5_runtime.sql"))'
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          INFO_DESK_HOME="$smoke_dir/home" "$GITHUB_WORKSPACE/.wheel-venv/bin/info-desk" init
          INFO_DESK_HOME="$smoke_dir/home" "$GITHUB_WORKSPACE/.wheel-venv/bin/info-desk" doctor > doctor.json
          python -c 'import json; result=json.load(open("doctor.json", encoding="utf-8")); assert result["ok"] is True; assert result["schema_version"] == 3'

  live-smoke:
    name: Bounded live source smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Contact each public source with one bounded request
        env:
          INFO_DESK_LIVE: "1"
          INFO_DESK_HOME: ${{ runner.temp }}/information-desk-live-no-db
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --locked pytest -p pytest_asyncio.plugin -m live -q --tb=short
