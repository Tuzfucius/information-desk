[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "information-desk"
version = "0.1.0"
description = "A local-first research and open-source intelligence service for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
info-desk = "info_desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/info_desk"]

[tool.hatch.build.targets.wheel.force-include]
"src/info_desk/storage/sql/001_initial.sql" = "info_desk/storage/sql/001_initial.sql"
"src/info_desk/storage/sql/002_reliability.sql" = "info_desk/storage/sql/002_reliability.sql"
"src/info_desk/storage/sql/003_m5_runtime.sql" = "info_desk/storage/sql/003_m5_runtime.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
  "live: bounded tests that contact public source APIs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
