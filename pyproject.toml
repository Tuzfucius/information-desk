[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "information-desk"
version = "0.1.0"
description = "A local-first research and open-source intelligence service for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2,<3",
]

[project.scripts]
info-desk = "info_desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/info_desk"]

[tool.hatch.build.targets.wheel.force-include]
"src/info_desk/storage/sql/001_initial.sql" = "info_desk/storage/sql/001_initial.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
